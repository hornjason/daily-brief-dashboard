name: "AI Challenge - Feature Request"
description: "Submit a feature idea for Brief Encounters"
title: "[Challenge] "
labels: ["ai-challenge", "team-submission", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        ## Submit an Idea
        Describe what you want to see. Don't worry about technical feasibility — just tell us the idea.

  - type: textarea
    id: description
    attributes:
      label: What's your idea?
      placeholder: "e.g., Show which data sources went into the brief so I know what's missing..."
    validations:
      required: true

  - type: dropdown
    id: theme
    attributes:
      label: Which theme?
      options:
        - "A: Show Your Work — expose how outputs are built"
        - "B: Make It Smarter — better reasoning and recommendations"
        - "C: Make It Shine — polish, clarity, first impressions"
        - "Not sure — let the team decide"
    validations:
      required: true

  - type: dropdown
    id: demo-impact
    attributes:
      label: How impactful for the demo video?
      options:
        - Must-have — the demo isn't complete without this
        - Strong addition — would clearly impress judges
        - Nice-to-have — good but not critical
    validations:
      required: true

  - type: textarea
    id: real-scenario
    attributes:
      label: Real scenario (optional but valuable)
      description: "When did you need this? Real stories make the video compelling."
      placeholder: "e.g., Last month I was prepping for a call and had to manually check 4 systems to find..."
