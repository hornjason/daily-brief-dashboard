name: Release Gate (Tier 2 E2E)

# Tier 2 — full E2E with real credentials.
# Run before pushing a production image on major releases.
# Triggered manually or on version tags.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.2.0)'
        required: true
        type: string
  push:
    tags:
      - 'v*'

jobs:
  release-e2e:
    name: Full E2E — real credentials
    runs-on: ubuntu-latest
    # Requires manual approval in GitHub → Settings → Environments → production
    environment: production
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install dashboard dependencies
        run: cd dashboard && bun install --frozen-lockfile

      - name: Build dashboard
        run: cd dashboard && bun run build

      - name: Install Playwright browsers
        run: bunx playwright install chromium --with-deps

      - name: Run full E2E suite
        run: CI=true bun run test:e2e
        env:
          # Google OAuth — from GitHub environment secrets
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          # Gemini / Vertex AI
          GEMINI_SERVICE_ACCOUNT_KEY: ${{ secrets.GEMINI_SERVICE_ACCOUNT_KEY }}
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
          # Salesforce
          SF_USERNAME: ${{ secrets.SF_USERNAME }}
          SF_PASSWORD: ${{ secrets.SF_PASSWORD }}
          SF_TOKEN: ${{ secrets.SF_TOKEN }}
          # Red Hat Portal session (optional — scraper tests only)
          RH_USERNAME: ${{ secrets.RH_USERNAME }}
          RH_PASSWORD: ${{ secrets.RH_PASSWORD }}
          # Test mode — skip manual-only flows
          RELEASE_GATE: 'true'

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ github.sha }}
          path: playwright-report/
          retention-days: 14

  publish-release:
    name: Tag and push release image
    runs-on: ubuntu-latest
    needs: [release-e2e]
    environment: production
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine version tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          fi

      - name: Inject Gemini key into defaults.env
        run: echo "GEMINI_SERVICE_ACCOUNT_KEY=${{ secrets.GEMINI_SERVICE_ACCOUNT_KEY }}" >> defaults.env

      - name: Build and push versioned image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          push: true
          tags: |
            ghcr.io/hornjason/daily-brief-dashboard:${{ steps.version.outputs.tag }}
            ghcr.io/hornjason/daily-brief-dashboard:stable
