name: Gate 4 — Release

# Gate 4 — comprehensive release validation. The only gate that runs the
# full E2E suite, wizard E2E, and smoke tests. Validates everything before
# a version is published to GHCR.
# Triggered manually or on version tags.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.2.0)'
        required: true
        type: string
  push:
    tags:
      - 'v*'

jobs:
  release-e2e:
    name: Full E2E — real credentials
    runs-on: [self-hosted, mac-mini-live]
    # Requires manual approval in GitHub → Settings → Environments → production
    environment: production
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run release API gate
        # Scope to API contract tests only — regression/ contains source-grep
        # tests that verify code patterns (not server behavior). Several are now
        # stale (REG-BOOT-06 checks for rh-cases enqueue intentionally removed in
        # BKL-BOOT-SCRAPE-ORDER-01; REG-079 checks retired Supportable code).
        # Stale regression cleanup tracked in BACKLOG as BKL-TEST-REG-CLEANUP-01.
        # setup.spec.ts pod-config tests excluded: beforeAll snapshot on prod
        # (ALLOW_RESET not set) interferes; non-destructive config tests should
        # move to a separate spec — tracked in BKL-TEST-REG-CLEANUP-01.
        #
        # v1.6.0 exclusions (all tracked in BACKLOG BKL-TEST-REG-CLEANUP-01):
        # - scaffold-status: bootstrap-scaffold.spec.ts tests GET /api/bootstrap/scaffold-status
        #   which is a new v1.6.0 endpoint; pre-deploy gate runs against v1.5.3 production.
        # - fromCache|brief returns 200 when pipeline: customers.spec.ts brief tests require
        #   KNOWN_CUSTOMER configured; 'Big Ten Network Services' not in Mac Mini data.
        # - intelligence-status for known customer|intelligence-status status field: same
        #   KNOWN_CUSTOMER data issue in intelligence.spec.ts.
        # - ScrapeStatusSchema|isRunning and isStale: api-contracts.spec.ts checks for
        #   'supportable' key in /api/status/scrapes — removed in v1.6.0 (BKL-ARCH-SCRAPER-09).
        #   Test is stale and needs update.
        # - A10 Networks|IntelligenceStatusSchema: api-contracts.spec.ts uses hardcoded
        #   'A10 Networks' customer which is not in Mac Mini production data.
        run: |
          CI=true bunx playwright test --project=ci \
            test/api/ test/contracts/ \
            --grep-invert="podSfReports|report IDs are 18-char|scaffold-status|fromCache|brief returns 200 when pipeline|intelligence-status for known customer|intelligence-status status field|ScrapeStatusSchema|isRunning and isStale|A10 Networks|IntelligenceStatusSchema"
        env:
          BASE_URL: http://localhost:7777
          RELEASE_GATE: 'true'

      - name: Install dashboard dependencies
        run: cd dashboard && bun install --frozen-lockfile

      - name: Build dashboard
        run: cd dashboard && bun run build

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Seed wizard test data
        run: |
          mkdir -p config cache cache/intelligence
          cp scripts/seed-data/aes.json config/aes.json
          cp scripts/seed-data/customers.json config/customers.json
          cp scripts/seed-data/settings.json config/settings.json
          cp scripts/seed-data/product-intel-config.json config/product-intel-config.json
          cp scripts/seed-data/data-sources.json config/data-sources.json
          cp -r scripts/seed-data/cache/. cache/
          TODAY=$(date +%Y-%m-%d)
          NOW=$(date -u +%Y-%m-%dT%H:%M:%S.000Z)
          SED_INPLACE=(sed -i '')
          for f in cache/*-2026-04-10.json; do
            [ -f "$f" ] || continue
            "${SED_INPLACE[@]}" "s/2026-04-10T00:00:00.000Z/$NOW/g" "$f"
            mv "$f" "${f%-2026-04-10.json}-${TODAY}.json"
          done
          for f in cache/*.json cache/intelligence/*.json; do
            [ -f "$f" ] && "${SED_INPLACE[@]}" "s/2026-04-10T00:00:00.000Z/$NOW/g" "$f"
          done

      - name: Start server on port 7778 for wizard E2E
        run: |
          PORT=7778 BASE_URL=http://localhost:7778 bun run server.ts &
          SERVER_PID=$!
          echo $SERVER_PID > /tmp/release-wizard-server.pid
          for i in $(seq 1 30); do
            curl -sf http://localhost:7778/health > /dev/null 2>&1 && echo "Server ready after $i seconds" && break
            sleep 1
          done
          curl -sf http://localhost:7778/health > /dev/null || (echo "Server failed to start" && exit 1)

      - name: Run wizard E2E tests
        env:
          BASE_URL: 'http://localhost:7778'
        # --grep-invert="visual baseline" skips toHaveScreenshot() assertions which are
        # platform-specific (laptop baselines differ from Mac Mini rendering).
        # Functional wizard tests still run and must pass.
        run: CI=true bunx playwright test test/wizard-e2e.spec.ts --project=wizard-e2e --workers=1 --reporter=list --grep-invert="visual baseline"

      # Smoke against the seeded server (not Mac Mini production, which may not have data).
      # The publish-release job runs its own smoke against the published image on port 7780.
      - name: Run smoke tests against seeded server
        run: CI=true bunx playwright test --project=smoke --reporter=list
        env:
          BASE_URL: http://localhost:7778

      - name: Stop wizard server
        if: always()
        run: |
          if [ -f /tmp/release-wizard-server.pid ]; then
            kill $(cat /tmp/release-wizard-server.pid) 2>/dev/null || true
            rm -f /tmp/release-wizard-server.pid
          fi

      # Placeholder: Hero install E2E (#111) — activate when hero-install-e2e.spec.ts ships
      # - name: Hero install fresh-install flow
      #   run: CI=true bunx playwright test test/hero-install-e2e.spec.ts --project=ci --reporter=list

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ github.sha }}
          path: playwright-report/
          retention-days: 14

      - name: Upload screenshots for visual review
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-screenshots-${{ github.sha }}
          path: test-results/
          retention-days: 14

  publish-release:
    name: Tag and push release image
    runs-on: [self-hosted, mac-mini-live]
    needs: [release-e2e]
    environment: production
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GHCR_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Determine version tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          fi

      - name: Build and push multi-arch versioned image
        run: |
          VERSION_TAG="${{ steps.version.outputs.tag }}"

          # Build natively first (full Dockerfile with builder stage)
          podman build -f Dockerfile.hero -t daily-brief-hero-native .
          NATIVE_ARCH=$(podman inspect daily-brief-hero-native --format '{{.Architecture}}')

          # Extract pre-built dashboard for cross-arch runtime-only build
          rm -rf .hero-dist
          podman create --name hero-extract daily-brief-hero-native true
          podman cp hero-extract:/app/dashboard/dist .hero-dist
          podman rm hero-extract

          if [ "$NATIVE_ARCH" = "arm64" ]; then
            podman tag daily-brief-hero-native daily-brief-hero-arm64
            podman build -f Dockerfile.hero-runtime --platform linux/amd64 -t daily-brief-hero-amd64 .
          else
            podman tag daily-brief-hero-native daily-brief-hero-amd64
            podman build -f Dockerfile.hero-runtime --platform linux/arm64 -t daily-brief-hero-arm64 .
          fi
          rm -rf .hero-dist

          # Collect tags to push
          TAGS=("${VERSION_TAG}")
          if [[ ! "${VERSION_TAG}" =~ -rc ]]; then
            TAGS+=("latest" "stable")
          fi

          # Create manifest list for each tag, add both arches, push
          for TAG in "${TAGS[@]}"; do
            podman manifest rm ghcr.io/hornjason/daily-brief-dashboard:${TAG} 2>/dev/null || true
            podman rmi ghcr.io/hornjason/daily-brief-dashboard:${TAG} 2>/dev/null || true
            podman manifest create ghcr.io/hornjason/daily-brief-dashboard:${TAG}
            podman manifest add ghcr.io/hornjason/daily-brief-dashboard:${TAG} containers-storage:localhost/daily-brief-hero-amd64:latest
            podman manifest add ghcr.io/hornjason/daily-brief-dashboard:${TAG} containers-storage:localhost/daily-brief-hero-arm64:latest
            podman manifest push --all ghcr.io/hornjason/daily-brief-dashboard:${TAG} docker://ghcr.io/hornjason/daily-brief-dashboard:${TAG}
          done

  sync-hero-install-files:
    name: Sync hero install files to public repo
    runs-on: [self-hosted, mac-mini-live]
    needs: [publish-release]
    if: "!contains(github.ref_name, '-rc')"
    environment: production
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Determine version tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          fi

      - name: Sync files to public repo (hornjason/daily-brief-dashboard)
        env:
          DEPLOY_TOKEN: ${{ secrets.PUBLIC_REPO_DEPLOY_TOKEN }}
        run: |
          # Clone the public repo using the deploy token
          git clone "https://x-access-token:${DEPLOY_TOKEN}@github.com/hornjason/daily-brief-dashboard.git" /tmp/public-repo
          cd /tmp/public-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Copy hero install files from private repo (checked out in $GITHUB_WORKSPACE)
          cp "$GITHUB_WORKSPACE/scripts/setup.sh" setup.sh
          cp "$GITHUB_WORKSPACE/scripts/upgrade.sh" upgrade.sh
          cp "$GITHUB_WORKSPACE/.env.example" .env.example
          cp "$GITHUB_WORKSPACE/docker-compose.yml" docker-compose.yml
          cp "$GITHUB_WORKSPACE/README.md" README.md

          # Commit and push if changed
          git add setup.sh upgrade.sh .env.example docker-compose.yml README.md
          if ! git diff --cached --quiet; then
            git commit -m "Release ${{ steps.version.outputs.tag }}: sync hero install files"
            git push origin main
            echo "✅ Hero install files synced to public repo"
          else
            echo "No changes to hero install files"
          fi

          # Clean up
          rm -rf /tmp/public-repo

  publish-public-release:
    name: Publish GitHub Release on public repo
    runs-on: [self-hosted, mac-mini-live]
    needs: [sync-hero-install-files]
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Determine version tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          fi

      - name: Generate changelog from private repo commits
        id: changelog
        run: |
          # Find the previous tag to diff against
          PREV_TAG=$(git tag --sort=-v:refname | grep -v "$(echo ${{ steps.version.outputs.tag }})" | head -1)
          if [ -z "$PREV_TAG" ]; then
            PREV_TAG=$(git rev-list --max-parents=0 HEAD)
          fi
          echo "Generating changelog: $PREV_TAG → ${{ steps.version.outputs.tag }}"

          # Group commits by conventional-commit prefix
          FEATS=$(git log "${PREV_TAG}..HEAD" --pretty=format:"- %s" --grep="^feat" --extended-regexp | head -20)
          FIXES=$(git log "${PREV_TAG}..HEAD" --pretty=format:"- %s" --grep="^fix" --extended-regexp | head -20)
          CHORES=$(git log "${PREV_TAG}..HEAD" --pretty=format:"- %s" --grep="^chore\|^docs\|^refactor\|^ci" --extended-regexp | head -10)

          BODY="## What's New in ${{ steps.version.outputs.tag }}"
          [ -n "$FEATS" ] && BODY="${BODY}\n\n### Features\n${FEATS}"
          [ -n "$FIXES" ] && BODY="${BODY}\n\n### Fixes\n${FIXES}"
          [ -n "$CHORES" ] && BODY="${BODY}\n\n### Other\n${CHORES}"
          BODY="${BODY}\n\n---\n*Install:* \`curl -fsSL https://github.com/hornjason/daily-brief-dashboard/releases/latest/download/setup.sh | bash\`"

          # Write to file to preserve newlines in the API call
          echo -e "$BODY" > /tmp/release-body.md
          echo "prev_tag=$PREV_TAG" >> $GITHUB_OUTPUT

      - name: Create GitHub Release with assets on public repo
        env:
          DEPLOY_TOKEN: ${{ secrets.PUBLIC_REPO_DEPLOY_TOKEN }}
          VERSION: ${{ steps.version.outputs.tag }}
        run: |
          # Create the release on the public repo with generated changelog
          BODY=$(cat /tmp/release-body.md)
          RELEASE=$(curl -sf -X POST \
            -H "Authorization: token $DEPLOY_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/hornjason/daily-brief-dashboard/releases \
            -d "$(python3 -c "import json,sys; print(json.dumps({'tag_name':'$VERSION','name':'$VERSION','body':open('/tmp/release-body.md').read()}))")")
          UPLOAD_URL=$(echo "$RELEASE" | python3 -c "import sys,json; print(json.load(sys.stdin)['upload_url'].split('{')[0])")

          # Upload assets
          for file in scripts/setup.sh scripts/upgrade.sh .env.example docker-compose.yml; do
            name=$(basename "$file")
            curl -sf -X POST \
              -H "Authorization: token $DEPLOY_TOKEN" \
              -H "Content-Type: application/octet-stream" \
              "$UPLOAD_URL?name=$name" \
              --data-binary "@$file"
            echo "Uploaded $name to GitHub Release"
          done
