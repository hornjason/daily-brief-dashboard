name: Release Gate (Tier 2 E2E)

# Tier 2 — full E2E with real credentials against the live prod server.
# Run before pushing a production image on major releases.
# Triggered manually or on version tags.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.2.0)'
        required: true
        type: string
  push:
    tags:
      - 'v*'

jobs:
  release-e2e:
    name: Full E2E — real credentials
    runs-on: [self-hosted, mac-mini-live]
    # Requires manual approval in GitHub → Settings → Environments → production
    environment: production
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run release API gate
        # Scope to API contract tests only — regression/ contains source-grep
        # tests that verify code patterns (not server behavior). Several are now
        # stale (REG-BOOT-06 checks for rh-cases enqueue intentionally removed in
        # BKL-BOOT-SCRAPE-ORDER-01; REG-079 checks retired Supportable code).
        # Stale regression cleanup tracked in BACKLOG as BKL-TEST-REG-CLEANUP-01.
        # setup.spec.ts pod-config tests excluded: beforeAll snapshot on prod
        # (ALLOW_RESET not set) interferes; non-destructive config tests should
        # move to a separate spec — tracked in BKL-TEST-REG-CLEANUP-01.
        #
        # v1.6.0 exclusions (all tracked in BACKLOG BKL-TEST-REG-CLEANUP-01):
        # - scaffold-status: bootstrap-scaffold.spec.ts tests GET /api/bootstrap/scaffold-status
        #   which is a new v1.6.0 endpoint; pre-deploy gate runs against v1.5.3 production.
        # - fromCache|brief returns 200 when pipeline: customers.spec.ts brief tests require
        #   KNOWN_CUSTOMER configured; 'Big Ten Network Services' not in Mac Mini data.
        # - intelligence-status for known customer|intelligence-status status field: same
        #   KNOWN_CUSTOMER data issue in intelligence.spec.ts.
        # - ScrapeStatusSchema|isRunning and isStale: api-contracts.spec.ts checks for
        #   'supportable' key in /api/status/scrapes — removed in v1.6.0 (BKL-ARCH-SCRAPER-09).
        #   Test is stale and needs update.
        # - A10 Networks|IntelligenceStatusSchema: api-contracts.spec.ts uses hardcoded
        #   'A10 Networks' customer which is not in Mac Mini production data.
        run: |
          CI=true bunx playwright test --project=ci \
            test/api/ test/contracts/ \
            --grep-invert="podSfReports|report IDs are 18-char|scaffold-status|fromCache|brief returns 200 when pipeline|intelligence-status for known customer|intelligence-status status field|ScrapeStatusSchema|isRunning and isStale|A10 Networks|IntelligenceStatusSchema"
        env:
          BASE_URL: http://localhost:7777
          RELEASE_GATE: 'true'

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ github.sha }}
          path: playwright-report/
          retention-days: 14

  publish-release:
    name: Tag and push release image
    runs-on: [self-hosted, mac-mini-live]
    needs: [release-e2e]
    environment: production
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        run: echo "${{ github.token }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Determine version tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          fi

      - name: Build and push versioned image
        run: |
          podman build \
            -t ghcr.io/hornjason/daily-brief-dashboard:${{ steps.version.outputs.tag }} \
            -t ghcr.io/hornjason/daily-brief-dashboard:stable \
            -t ghcr.io/hornjason/daily-brief-dashboard:latest \
            -f Containerfile .
          podman push ghcr.io/hornjason/daily-brief-dashboard:${{ steps.version.outputs.tag }}
          podman push ghcr.io/hornjason/daily-brief-dashboard:stable
          podman push ghcr.io/hornjason/daily-brief-dashboard:latest

  publish-public-release:
    name: Publish to daily-brief-dashboard
    runs-on: [self-hosted, mac-mini-live]
    needs: [publish-release]
    environment: production
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Determine version tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          fi

      - name: Publish release to public repo
        env:
          DEPLOY_TOKEN: ${{ secrets.PUBLIC_REPO_DEPLOY_TOKEN }}
          VERSION: ${{ steps.version.outputs.tag }}
        run: |
          # Create the release
          RELEASE=$(curl -sf -X POST \
            -H "Authorization: token $DEPLOY_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/hornjason/daily-brief-dashboard/releases \
            -d "{\"tag_name\":\"$VERSION\",\"name\":\"$VERSION\",\"generate_release_notes\":true}")
          UPLOAD_URL=$(echo "$RELEASE" | python3 -c "import sys,json; print(json.load(sys.stdin)['upload_url'].split('{')[0])")

          # Upload assets
          for file in scripts/setup.sh .env.example docker-compose.yml; do
            name=$(basename "$file")
            curl -sf -X POST \
              -H "Authorization: token $DEPLOY_TOKEN" \
              -H "Content-Type: application/octet-stream" \
              "$UPLOAD_URL?name=$name" \
              --data-binary "@$file"
            echo "Uploaded $name"
          done
