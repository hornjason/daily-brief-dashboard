name: Gate 3 — Nightly Data Assertions

on:
  # Run every night at 6:00 AM UTC (after overnight batch typically completes)
  # Staggered from :00 to avoid API load spikes across the fleet
  schedule:
    - cron: '7 6 * * *'

  # Manual trigger for testing
  workflow_dispatch:

jobs:
  nightly-assertions:
    name: Data integrity validation
    runs-on: [self-hosted, mac-mini-live]
    timeout-minutes: 3  # 90s budget + buffer
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Check for batch lockfile
        id: lockfile_check
        run: |
          LOCKFILE="$HOME/daily-brief-batch.lock"
          if [ -f "$LOCKFILE" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "⚠ Batch lockfile detected at $LOCKFILE — skipping assertions"
            echo "This is not a failure — batch is still running, will retry tomorrow"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "✓ No lockfile — batch has completed, proceeding with assertions"
          fi

      - name: Verify container health
        if: steps.lockfile_check.outputs.skip == 'false'
        run: |
          if ! podman ps --filter name=pai-dashboard --format "{{.Names}}" | grep -q pai-dashboard; then
            echo "❌ pai-dashboard container is not running"
            echo "Fix: cd ~/DailyBriefDashboard && make up"
            exit 1
          fi
          # Wait up to 30s for API to be ready
          for i in $(seq 1 6); do
            if curl -sf http://localhost:7777/api/aes >/dev/null 2>&1; then
              echo "✓ Container running and API healthy"
              exit 0
            fi
            sleep 5
          done
          echo "❌ API not responding after 30s — container may be unhealthy"
          echo "Check: podman logs pai-dashboard --tail 50"
          exit 1

      - name: Run nightly assertions
        if: steps.lockfile_check.outputs.skip == 'false'
        run: bun scripts/nightly-assertions.ts
        env:
          BASE_URL: 'http://localhost:7777'

      - name: Post results summary
        if: always() && steps.lockfile_check.outputs.skip == 'false'
        run: |
          if [ ${{ job.status }} == 'success' ]; then
            echo "✅ Gate 3 PASSED — production data integrity verified"
          else
            echo "❌ Gate 3 FAILED — see assertion output above for details"
          fi
