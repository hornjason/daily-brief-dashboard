name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/pull_request_template.md'

jobs:
  test:
    name: Unit tests & type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
          cache: true

      - name: Install root dependencies
        run: bun install --frozen-lockfile

      - name: Install dashboard dependencies
        run: cd dashboard && bun install --frozen-lockfile

      - name: TypeScript check (dashboard)
        run: cd dashboard && bunx tsc --noEmit

      - name: Run unit tests
        run: bun test src/

      - name: Build dashboard
        run: cd dashboard && bun run build

      - name: Upload dashboard build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-dist-${{ github.sha }}
          path: dashboard/dist/
          retention-days: 1

  publish:
    name: Build & push container image
    runs-on: ubuntu-latest
    needs: [test]
    # Only push on main branch pushes (not PRs)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push container image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          push: true
          tags: |
            ghcr.io/hornjason/daily-brief-dashboard:latest
            ghcr.io/hornjason/daily-brief-dashboard:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  smoke:
    name: Container smoke test
    runs-on: ubuntu-latest
    needs: [publish]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    timeout-minutes: 5
    steps:
      - name: Log in to GitHub Container Registry
        run: |
          echo "${{ secrets.GHCR_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Pull published image
        run: podman pull ghcr.io/hornjason/daily-brief-dashboard:latest

      - name: Start container
        run: |
          podman run -d --name smoke-test \
            -p 7777:7777 \
            ghcr.io/hornjason/daily-brief-dashboard:latest

      - name: Wait for healthy (up to 30s)
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:7777/health; then
              echo ""
              echo "Health check passed on attempt $i"
              exit 0
            fi
            sleep 1
          done
          echo "Health check failed after 30 seconds"
          podman logs smoke-test
          exit 1

      - name: Verify health response
        run: |
          BODY=$(curl -sf http://localhost:7777/health)
          echo "Response: $BODY"
          echo "$BODY" | grep -q '"status":"ok"' || {
            echo "Expected {\"status\":\"ok\"} but got: $BODY"
            exit 1
          }

      - name: Shutdown container
        if: always()
        run: podman rm -f smoke-test

  e2e:
    name: Integration & E2E tests
    runs-on: ubuntu-latest
    needs: [test]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
          cache: true

      - name: Install root dependencies
        run: bun install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package.json', 'bun.lockb') }}

      - name: Install Playwright browsers
        run: bunx playwright install chromium --with-deps

      - name: Install dashboard dependencies
        run: cd dashboard && bun install --frozen-lockfile

      - name: Download dashboard build artifact
        uses: actions/download-artifact@v4
        with:
          name: dashboard-dist-${{ github.sha }}
          path: dashboard/dist/

      - name: Run tests
        run: CI=true bunx playwright test --project=ci --workers=2 --reporter=list
        # --project=ci excludes @live-tagged tests and files in testIgnore (bootstrap-e2e, e2e-carolanne).
        # Covers: api/, contracts/, regression, wizard, ui/, performance, accessibility, dashboard, qa.
        # No Google credentials required. Live scraper tests run in Tier 2 (release.yml).
