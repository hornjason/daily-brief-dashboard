name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    name: Unit tests & type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install root dependencies
        run: bun install --frozen-lockfile

      - name: Install dashboard dependencies
        run: cd dashboard && bun install --frozen-lockfile

      - name: TypeScript check (dashboard)
        run: cd dashboard && bunx tsc --noEmit

      - name: Run unit tests
        run: bun test src/

      - name: Build dashboard
        run: cd dashboard && bun run build

  publish:
    name: Build & push container image
    runs-on: ubuntu-latest
    needs: [test]
    # Only push on main branch pushes (not PRs)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push container image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          push: true
          tags: |
            ghcr.io/hornjason/daily-brief-dashboard:latest
            ghcr.io/hornjason/daily-brief-dashboard:${{ github.sha }}

  smoke:
    name: Container smoke test
    runs-on: ubuntu-latest
    needs: [publish]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      packages: read
    steps:
      - name: Log in to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Pull published image
        run: podman pull ghcr.io/hornjason/daily-brief-dashboard:latest

      - name: Start container
        run: |
          podman run -d --name smoke-test \
            -p 7777:7777 \
            ghcr.io/hornjason/daily-brief-dashboard:latest

      - name: Wait for healthy (up to 30s)
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:7777/health; then
              echo ""
              echo "Health check passed on attempt $i"
              exit 0
            fi
            sleep 1
          done
          echo "Health check failed after 30 seconds"
          podman logs smoke-test
          exit 1

      - name: Verify health response
        run: |
          BODY=$(curl -sf http://localhost:7777/health)
          echo "Response: $BODY"
          echo "$BODY" | grep -q '"status":"ok"' || {
            echo "Expected {\"status\":\"ok\"} but got: $BODY"
            exit 1
          }

      - name: Shutdown container
        if: always()
        run: podman rm -f smoke-test

  e2e:
    name: Wizard E2E tests
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install root dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install chromium --with-deps

      - name: Install dashboard dependencies
        run: cd dashboard && bun install --frozen-lockfile

      - name: Build dashboard
        run: cd dashboard && bun run build

      - name: Run E2E wizard tests
        run: CI=true bun run test:e2e
        # Server started automatically by playwright.config.ts webServer
        # No Google credentials needed — only tests UI rendering and step labels
