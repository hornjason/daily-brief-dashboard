name: CI
# Gate 2 — fast feedback on every push to main.
# E2E and wizard tests live in release.yml (Gate 4) only.
# Council 4-gate model: CONTEXT.md §CI gates, issue #138.

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/pull_request_template.md'

# When multiple pushes to main land quickly (e.g., merging 3 PRs),
# cancel in-progress runs and only build the latest commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    name: Shellcheck
    runs-on: [self-hosted, mac-mini-live]
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: brew install shellcheck 2>/dev/null || true  # install if not present on mac-mini-live
      - name: Run shellcheck
        run: shellcheck scripts/setup.sh scripts/check-env-drift.sh

  drift-gate:
    name: Env drift gate (.env.example / compose / setup.sh)
    runs-on: [self-hosted, mac-mini-live]
    steps:
      - uses: actions/checkout@v4
      - name: Install bats-core
        run: brew install bats-core 2>/dev/null || true  # already installed on mac-mini-live
      - name: Check env drift (live repo)
        run: bash scripts/check-env-drift.sh
      - name: Run drift BATS suite
        run: bats test/drift.bats

  bats:
    name: BATS tests
    runs-on: [self-hosted, mac-mini-live]
    steps:
      - uses: actions/checkout@v4
      - name: Install bats-core
        run: brew install bats-core
      - name: Run setup tests
        run: bats test/setup.bats
      - name: Run drift tests
        run: bats test/drift.bats

  test:
    name: Unit tests & type check
    runs-on: [self-hosted, mac-mini-live]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
          cache: true

      - name: Install root dependencies
        run: bun install --frozen-lockfile

      - name: Install dashboard dependencies
        run: cd dashboard && bun install --frozen-lockfile

      - name: TypeScript check (dashboard)
        run: cd dashboard && bunx tsc --noEmit

      - name: Run unit tests
        run: bun test src/ test/unit/

      - name: Hero purity check (no L4 imports in hero image)
        run: bunx tsc --noEmit --project tsconfig.hero.json

      - name: SetupPage size check
        run: |
          count=$(wc -l < dashboard/src/pages/SetupPage.tsx)
          echo "SetupPage.tsx: $count lines"
          [ "$count" -lt 3200 ] || (echo "SetupPage.tsx exceeds 3200 lines ($count) — DataSourcesSection was removed in BKL-ARCH-12, file should not regrow past this ceiling" && exit 1)

      - name: Build dashboard
        run: cd dashboard && bun run build

      - name: Upload dashboard build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-dist-${{ github.sha }}
          path: dashboard/dist/
          retention-days: 1

      - name: Audit docs
        run: bun scripts/audit-docs.ts || echo "::warning::Doc audit found issues — review output above"

  publish:
    name: Build & push container image
    runs-on: [self-hosted, mac-mini-live]
    needs: [test]
    # Only push on main branch pushes (not PRs)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GHCR_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and push multi-arch container image
        # Do NOT push :latest here. :latest is reserved for the release workflow's
        # publish-stable job (updated ONLY after the release smoke gate passes), to match
        # docker-compose.yml and README :latest references. Main-branch CI pushes a
        # commit-sha tag plus :main-latest for internal smoke tests.
        run: |
          TAGS=("main-latest" "${{ github.sha }}")
          for TAG in "${TAGS[@]}"; do
            podman manifest rm ghcr.io/hornjason/daily-brief-dashboard:${TAG} 2>/dev/null || true
            podman rmi ghcr.io/hornjason/daily-brief-dashboard:${TAG} 2>/dev/null || true
            podman manifest create ghcr.io/hornjason/daily-brief-dashboard:${TAG}
          done

          podman build -f Dockerfile.hero --platform linux/amd64 -t daily-brief-hero-amd64 .
          podman build -f Dockerfile.hero --platform linux/arm64 -t daily-brief-hero-arm64 .

          for TAG in "${TAGS[@]}"; do
            podman manifest add ghcr.io/hornjason/daily-brief-dashboard:${TAG} containers-storage:localhost/daily-brief-hero-amd64:latest
            podman manifest add ghcr.io/hornjason/daily-brief-dashboard:${TAG} containers-storage:localhost/daily-brief-hero-arm64:latest
            podman manifest push --all ghcr.io/hornjason/daily-brief-dashboard:${TAG} docker://ghcr.io/hornjason/daily-brief-dashboard:${TAG}
          done

  smoke:
    name: Container smoke test
    runs-on: [self-hosted, mac-mini-live]
    needs: [publish]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    timeout-minutes: 5
    permissions:
      contents: read
      packages: read
    steps:
      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GHCR_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Pull published image
        run: podman pull ghcr.io/hornjason/daily-brief-dashboard:main-latest

      - name: Clean up any previous smoke container
        run: podman rm -f smoke-test 2>/dev/null || true

      - name: Start container
        # Use port 7780 — production pai-dashboard owns 7777 on this runner.
        # Podman proxy returns "proxy already running" if two containers bind same external port.
        run: |
          podman run -d --name smoke-test \
            -p 7780:7777 \
            ghcr.io/hornjason/daily-brief-dashboard:main-latest

      - name: Wait for /api/aes (up to 60s)
        # Matches the release.yml smoke probe — both gates use the same readiness endpoint.
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:7780/api/aes >/dev/null; then
              echo "Boot gate passed on attempt $i"
              exit 0
            fi
            sleep 1
          done
          echo "Boot gate FAILED — /api/aes did not respond within 60 seconds"
          podman logs smoke-test
          exit 1

      - name: Shutdown container
        if: always()
        run: podman rm -f smoke-test
