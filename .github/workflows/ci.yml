name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    name: Unit tests & type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install root dependencies
        run: bun install --frozen-lockfile

      - name: Install dashboard dependencies
        run: cd dashboard && bun install --frozen-lockfile

      - name: TypeScript check (dashboard)
        run: cd dashboard && bunx tsc --noEmit

      - name: Run unit tests
        run: bun test src/

      - name: Build dashboard
        run: cd dashboard && bun run build

  publish:
    name: Build & push container image
    runs-on: ubuntu-latest
    needs: [test]
    # Only push on main branch pushes (not PRs)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push container image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          push: true
          tags: |
            ghcr.io/hornjason/asacommandcenter:latest
            ghcr.io/hornjason/asacommandcenter:${{ github.sha }}

  e2e:
    name: Wizard E2E tests
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install root dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install chromium --with-deps

      - name: Install dashboard dependencies
        run: cd dashboard && bun install --frozen-lockfile

      - name: Build dashboard
        run: cd dashboard && bun run build

      - name: Run E2E wizard tests
        run: CI=true bun run test:e2e
        # Server started automatically by playwright.config.ts webServer
        # No Google credentials needed — only tests UI rendering and step labels
